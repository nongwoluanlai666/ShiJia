<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<meta name=viewport content=width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no>
<meta name=theme-color content=#0b1220>
<title>使驾</title>
<style>
:root{color-scheme:dark;--surface:#0e1a2d;--line:#29415f;--text:#e7eef9;--muted:#8fa2bd;--accent:#9b5cff;--danger:#772b43}*{box-sizing:border-box}html,body{height:100%;margin:0;background:radial-gradient(circle at 50% -20%,#1b2c4d,#07101f 48%);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{color:var(--text);cursor:pointer;border:0}button:disabled{opacity:.45}.hidden{display:none!important}.login{height:100%;display:grid;place-items:center;padding:20px}.login-card,.section,.chat{background:#0e1a2d;border:1px solid var(--line);border-radius:20px}.login-card{width:min(410px,100%);padding:28px}.brand{font-size:26px;font-weight:800}.muted,.note{color:var(--muted);font-size:12px}
.field,textarea{width:100%;border:1px solid #385174;border-radius:12px;padding:10px 13px;background:#0a1527;color:var(--text);outline:0}.field{height:44px}.field:focus,textarea:focus{border-color:var(--accent)}.primary,.secondary,.danger,.ghost{border-radius:11px;min-height:40px;padding:0 13px;font-weight:700}.primary{background:#8951e8}.secondary{background:#182941;border:1px solid #365073}.danger{background:var(--danger);border:1px solid #b84059}.ghost{background:transparent}.error{padding:9px;border-radius:10px;background:#5c2535;color:#ffd5dc;margin-top:10px}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}.top{height:62px;display:flex;align-items:center;gap:9px;padding:8px max(9px,calc((100vw - 820px)/2));background:#0a1425;border-bottom:1px solid var(--line);flex:none}.menu{width:42px;height:42px;background:#14243d;border:1px solid #304665;border-radius:12px;font-size:21px}.top-title{min-width:0;flex:1}.top-title b,.top-title small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-title small{color:var(--muted);font-size:11px}.status{font-size:11px;color:var(--muted)}.status.busy{color:#ffc857}.status.error-tone{color:#ff7485}.stop{min-height:31px;padding:0 9px;border-radius:9px;background:var(--danger);font-size:12px}
.content{min-height:0;flex:1;display:flex;justify-content:center;padding:9px}.page{width:min(820px,100%);min-height:0;display:flex;flex-direction:column}.chat{min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden}.messages{min-height:0;flex:1;overflow:auto;padding:14px 11px}.row{display:flex;margin:8px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(90%,680px);padding:10px 12px;border:1px solid var(--line);border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.row.user .bubble{background:#3b2c72;border-color:#7953cf;border-bottom-right-radius:5px}.row.assistant .bubble{background:#13223a;border-bottom-left-radius:5px}.role{font-size:11px;color:#adbad0;font-weight:700}.meta{font-size:10px;color:#8295b1;margin-top:4px}.composer{display:flex;gap:7px;padding:9px;border-top:1px solid var(--line);background:#0d192c}.composer textarea{min-height:45px;max-height:150px;resize:vertical;flex:1}.hint{padding:0 11px 7px;color:var(--muted);font-size:11px}.empty-chat{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}
.drawer-bg{position:fixed;inset:0;background:#0008;z-index:10}.drawer{position:fixed;z-index:11;left:0;top:0;bottom:0;width:min(350px,88vw);padding:16px;background:#091322;border-right:1px solid var(--line);transform:translateX(-105%);transition:.2s;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head,.section-head,.line{display:flex;align-items:center;justify-content:space-between;gap:8px}.drawer-section{border-top:1px solid #243650;padding:14px 0}.drawer-actions,.list{display:grid;gap:8px;margin-top:9px}.drawer-link{width:100%;text-align:left;background:#14233a;border:1px solid #2b4568;border-radius:12px;padding:11px}.drawer-link.active{background:#302256;border-color:#8557dd}.workflow{width:min(980px,100%);overflow:auto}.section{margin-bottom:9px;overflow:hidden}.section-head{padding:12px 14px;border-bottom:1px solid #243650}.section-body{padding:11px 13px}.item{border:1px solid #2b4263;border-radius:12px;background:#111f35;padding:10px}.item-button{width:100%;text-align:left}.item-name{font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.list-actions button{min-height:33px;font-size:12px}
.log{margin-top:7px;max-height:180px;overflow:auto;background:#07101d;border:1px solid #203653;border-radius:9px;padding:7px;color:#c9d7ea;font:11px Consolas,monospace;white-space:pre-wrap}.modal-bg{position:fixed;inset:0;display:grid;place-items:center;background:#0009;z-index:20;padding:18px}.modal{width:min(440px,100%);padding:17px;background:var(--surface);border:1px solid var(--line);border-radius:17px}.modal .field{margin:0 0 9px}.modal-actions{display:flex;justify-content:flex-end;gap:7px}@media(max-width:560px){.content{padding:6px}.bubble{max-width:95%}.top{padding:7px}.composer{padding:7px}.drawer{width:88vw}.status{max-width:72px;overflow:hidden}}
</style>
</head>
<body>
<section id=login class=login>
<div class="login-card"><div class="brand">使驾</div><div class="muted" style="margin:4px 0 22px">轻量远程工作流与 Codex 会话</div><form id="loginForm"><input id="accessCode" class="field" type="password" placeholder="输入 Web 访问码"><button id="loginButton" class="primary" style="width:100%;margin-top:11px">登录</button></form><div id="loginError" class="error hidden"></div></div></section>
<section id="app" class="app hidden"><header class="top"><button id="menuButton" class="menu">☰</button><div class="top-title"><b id="topTitle">使驾</b><small id="topSubtitle">请选择项目和会话</small></div><span id="status" class="status">空闲</span><button id="stopConversation" class="stop hidden">停止</button></header><main class="content">
<div id="conversationPage" class="page"><div class="chat"><div id="messages" class="messages"></div><div class="hint">Ctrl+Enter 发送 · Enter 换行</div><form id="composer" class="composer"><textarea id="messageInput" rows="1" placeholder="输入消息…"></textarea><button id="sendButton" class="primary">发送</button></form></div></div>
<div id="workflowPage" class="workflow hidden"><div class="section"><div class="section-head"><b>工作流</b><button id="workflowRefresh" class="secondary">刷新</button></div><div class="section-body"><div id="workflowList" class="list"></div></div></div><div class="section"><div class="section-head"><b>运行中任务</b><span id="runningCount" class="note"></span></div><div class="section-body"><div id="runningList" class="list"></div></div></div><div class="section"><div class="section-head"><b>会话管理</b><span class="note">点击切换</span></div><div class="section-body"><div id="sessionList" class="list"></div></div></div></div></main></section>
<div id="drawerBg" class="drawer-bg hidden"></div><aside id="drawer" class="drawer"><div class="drawer-head"><b style="font-size:19px">使驾</b><button id="closeDrawer" class="ghost">关闭</button></div><div class="drawer-section"><div class="muted">项目</div><select id="projectSelect" class="field"></select><div id="projectMeta" class="note"></div></div><div class="drawer-section"><div class="muted">Codex 会话</div><select id="sessionSelect" class="field"></select><div id="sessionMeta" class="note"></div><div class="drawer-actions"><button id="newSession" class="primary">新建会话</button><button id="conversationEntry" class="drawer-link active">返回会话</button><button id="workflowEntry" class="drawer-link">工作流、日志与会话管理</button></div></div></aside>
<div id="newSessionModal" class="modal-bg hidden"><form id="newSessionForm" class="modal"><h3 style="margin:0 0 12px">新建 Codex 会话</h3><input id="newSessionDescription" class="field" placeholder="会话描述（可留空）"><input id="newSessionModel" class="field" placeholder="模型 ID（可留空）"><div class="modal-actions"><button type="button" id="cancelNewSession" class="secondary">取消</button><button class="primary">创建</button></div></form></div>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');const asArray=value=>Array.isArray(value)?value:(value==null?[]:[value]);
let token=localStorage.getItem('shijia_web_token')||'';
const state={projects:[],projectId:localStorage.getItem('shijia_web_project')||'',sessionKey:'',sessionIndex:-1,view:'conversation',detail:null,running:[],sessions:[],refreshing:false,messageSignature:''};
let projectSelectionInitialized=localStorage.getItem('shijia_web_project')!==null;
function sessionStorageKey(projectId){return 'shijia_web_session_'+(projectId||'_ungrouped')}
function currentProject(){return state.projects.find(x=>String(x.id)===String(state.projectId))||null}
function currentSessions(){return asArray(currentProject()?.codexSessions)}
function currentSession(){return currentSessions().find(x=>String(x.sessionKey)===String(state.sessionKey))||null}
function rememberSelection(){localStorage.setItem('shijia_web_project',state.projectId||'');localStorage.setItem(sessionStorageKey(state.projectId),state.sessionKey||'')}
function showLoginError(text){$('loginError').textContent=text||'';$('loginError').classList.toggle('hidden',!text)}
function showApp(value){$('login').classList.toggle('hidden',value);$('app').classList.toggle('hidden',!value)}
function flashError(text){let node=$('appError');if(!node){node=document.createElement('div');node.id='appError';node.className='error';node.style.position='fixed';node.style.zIndex='40';node.style.top='70px';node.style.left='50%';node.style.transform='translateX(-50%)';node.style.maxWidth='90vw';document.body.appendChild(node)}node.textContent=text;node.classList.remove('hidden');clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.add('hidden'),5000)}
async function api(path,options={}){const headers=Object.assign({'Content-Type':'application/json'},options.headers||{});if(token)headers.Authorization='Bearer '+token;const response=await fetch(path,Object.assign({},options,{headers}));const body=await response.json().catch(()=>({}));if(response.status===401){token='';localStorage.removeItem('shijia_web_token');showApp(false);showLoginError('登录已过期，请重新登录');throw Error('登录已过期，请重新登录')}if(!response.ok||body.ok===false)throw Error(body.error?.message||'请求失败');return body.data}
function chooseValidSelection(selectedProject){if(!state.projects.some(x=>String(x.id)===String(state.projectId))){state.projectId=!projectSelectionInitialized&&selectedProject!==undefined?String(selectedProject||''):String(state.projects[0]?.id||'')}if(!state.projects.some(x=>String(x.id)===String(state.projectId)))state.projectId=String(state.projects[0]?.id||'');projectSelectionInitialized=true;const sessions=currentSessions();const previousIndex=state.sessionIndex;const stored=localStorage.getItem(sessionStorageKey(state.projectId))||'';let session=sessions.find(x=>String(x.sessionKey)===String(state.sessionKey));if(!session&&previousIndex>=0)session=sessions.find(x=>Number(x.index)===Number(previousIndex));if(!session)session=sessions.find(x=>String(x.sessionKey)===String(stored));if(!session)session=sessions[0]||null;state.sessionKey=session?String(session.sessionKey):'';state.sessionIndex=session?Number(session.index):-1;rememberSelection()}
function renderSelectors(){const project=currentProject();$('projectSelect').innerHTML=state.projects.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('projectSelect').value=state.projectId;$('projectMeta').textContent=project?`${project.defaultWorkingDirectory||'未配置工作目录'} · ${project.workflowCount||0} 个工作流`:'';const sessions=currentSessions();$('sessionSelect').innerHTML=sessions.length?sessions.map(x=>`<option value="${esc(x.sessionKey)}">${esc(x.description||'无描述')} · ${esc(x.status||'')}</option>`).join(''):'<option value="">暂无会话</option>';$('sessionSelect').value=state.sessionKey;const session=currentSession();$('sessionMeta').textContent=session?`${session.sessionId||'首次发送时创建'} · ${session.model||'未指定模型'}`:'当前项目暂无会话';$('newSession').disabled=!project||!project.id}
function renderHeader(){const project=currentProject(),session=currentSession();$('topTitle').textContent=project?`${project.name} · ${session?.description||'暂无会话'}`:'使驾';$('topSubtitle').textContent=session?(session.sessionId||'未创建会话'):'请从菜单选择或新建会话'}
function setStatus(text,tone=''){const node=$('status');node.textContent=text||'空闲';node.className='status '+(tone==='busy'?'busy':tone==='error'?'error-tone':'');$('stopConversation').classList.toggle('hidden',!(state.detail?.running));$('sendButton').disabled=!state.sessionKey||!!state.detail?.busy}
function formatTime(value){if(!value)return '';const date=new Date(value);return Number.isNaN(date.getTime())?'':date.toLocaleString()}
function renderMessages(messages){messages=asArray(messages);const signature=JSON.stringify(messages.map(x=>[x.role,x.text,x.timestamp,x.pending]));if(signature===state.messageSignature)return;const firstRender=!state.messageSignature;state.messageSignature=signature;const box=$('messages'),nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90,oldTop=box.scrollTop;if(!messages.length){box.innerHTML='<div class="empty-chat">暂无消息<br><span class="note">从下方输入框发送第一条 Codex 消息</span></div>'}else{box.innerHTML=messages.map(x=>`<div class="row ${x.role==='user'?'user':'assistant'}"><article class="bubble"><div class="role">${x.role==='user'?'你':'Codex'}${x.pending?' · 发送中':''}</div><div>${esc(x.text||'')}</div><div class="meta">${esc(formatTime(x.timestamp||x.time))}</div></article></div>`).join('')}requestAnimationFrame(()=>{box.scrollTop=nearBottom||firstRender?box.scrollHeight:oldTop})}
function renderWorkflow(){const project=currentProject(),workflows=asArray(project?.workflows);$('workflowList').innerHTML=workflows.length?workflows.map(x=>`<div class="item"><div class="line"><span class="item-name">${esc(x.name)}</span><span class="note">${x.running?'运行中':x.enabled?'已启用':'未启用'}</span></div><div class="list-actions"><button class="primary" data-run="${esc(x.id)}" ${x.running?'disabled':''}>执行</button><button class="danger" data-stop-workflow="${esc(x.id)}" ${x.running?'':'disabled'}>停止</button></div></div>`).join(''):'<div class="note">暂无工作流</div>';const running=asArray(state.running);$('runningCount').textContent=running.length?`${running.length} 个任务`:'暂无';$('runningList').innerHTML=running.length?running.map(x=>`<div class="item"><div class="line"><span class="item-name">${esc(x.workflowName)}</span><button class="danger" data-stop-running="${esc(x.workflowId)}">停止</button></div><div class="note">${esc(x.status||'')} · ${esc(x.currentNodeName||'等待节点')}</div><div class="log">${esc(asArray(x.logs).map(l=>`[${l.at||''}] ${l.message||''}`).join('\n'))}</div></div>`).join(''):'<div class="note">没有运行中的任务</div>';$('sessionList').innerHTML=state.sessions.length?state.sessions.map(x=>`<button class="item item-button" data-project="${esc(x.projectId)}" data-session="${esc(x.sessionKey)}" data-index="${x.index}"><div class="line"><span class="item-name">${esc(x.projectName)} · ${esc(x.description||'无描述')}</span><span class="note">${esc(x.status||'')}</span></div><div class="note">${esc(x.sessionId||'未创建')} · ${esc(x.model||'未指定模型')}</div></button>`).join(''):'<div class="note">暂无会话记录</div>'}
function openDrawer(value){$('drawer').classList.toggle('open',value);$('drawerBg').classList.toggle('hidden',!value)}
function setView(view){state.view=view;$('conversationPage').classList.toggle('hidden',view!=='conversation');$('workflowPage').classList.toggle('hidden',view!=='workflow');$('conversationEntry').classList.toggle('active',view==='conversation');$('workflowEntry').classList.toggle('active',view==='workflow');openDrawer(false)}
async function loadDetail(){const project=currentProject();if(!project||!state.sessionKey){state.detail=null;state.messageSignature='';renderHeader();renderMessages([]);setStatus('空闲');return}try{const data=await api(`/web/api/projects/${encodeURIComponent(project.id)}/sessions/${encodeURIComponent(state.sessionKey)}`);state.detail=data;state.sessionIndex=Number(data.index);renderHeader();renderMessages(data.messages||[]);setStatus(data.status||'空闲',data.running||data.busy?'busy':'')}catch(error){flashError(error.message)}}
async function refreshData(quiet=false){if(state.refreshing)return;state.refreshing=true;try{const boot=await api('/web/api/bootstrap');state.projects=asArray(boot.projects);chooseValidSelection(boot.selectedProject);state.running=asArray(boot.running);const all=await api('/web/api/sessions');state.sessions=asArray(all.sessions);renderSelectors();renderHeader();renderWorkflow();if(state.view==='conversation')await loadDetail()}catch(error){if(!quiet&&token)flashError(error.message)}finally{state.refreshing=false}}
async function sendMessage(){const input=$('messageInput'),message=input.value.trim(),project=currentProject();if(!message||!project||!state.sessionKey)return;try{$('sendButton').disabled=true;setStatus('发送中','busy');await api(`/web/api/projects/${encodeURIComponent(project.id)}/sessions/${encodeURIComponent(state.sessionKey)}/messages`,{method:'POST',body:JSON.stringify({message})});input.value='';state.messageSignature='';await refreshData(true)}catch(error){flashError(error.message);setStatus('发送失败','error')}finally{$('sendButton').disabled=false}}
async function stopConversation(){const project=currentProject();if(!project||!state.sessionKey)return;try{await api(`/web/api/projects/${encodeURIComponent(project.id)}/sessions/${encodeURIComponent(state.sessionKey)}/stop`,{method:'POST',body:'{}'});await refreshData(true)}catch(error){flashError(error.message)}}
async function createSession(description,model){const project=currentProject();if(!project?.id)return;try{const item=await api(`/web/api/projects/${encodeURIComponent(project.id)}/sessions`,{method:'POST',body:JSON.stringify({description,model})});state.sessionKey=String(item.sessionKey);state.sessionIndex=Number(item.index);rememberSelection();$('newSessionModal').classList.add('hidden');state.messageSignature='';await refreshData()}catch(error){flashError(error.message)}}
async function runWorkflow(id,stop=false){const project=currentProject();if(!project)return;const projectRoute=project.id?encodeURIComponent(project.id):'_ungrouped';const path=`/web/api/projects/${projectRoute}/workflows/${encodeURIComponent(id)}/${stop?'stop':'run'}`;try{await api(path,{method:'POST',body:'{}'});await refreshData(true)}catch(error){flashError(error.message)}}
function safeProjectId(value){const text=String(value??'').trim();return text==='undefined'||text==='null'?'':text}
function safeSessionKey(value){const text=String(value??'').trim();return text==='undefined'||text==='null'?'':text}
function sessionStorageKey(projectId){return 'shijia_web_session_'+(safeProjectId(projectId)||'_ungrouped')}
function currentProject(){return state.projects.find(x=>safeProjectId(x?.id)===safeProjectId(state.projectId))||null}
function currentSessions(){return asArray(currentProject()?.codexSessions)}
function currentSession(){const key=safeSessionKey(state.sessionKey);return key?currentSessions().find(x=>safeSessionKey(x?.sessionKey)===key)||null:null}
function rememberSelection(){state.projectId=safeProjectId(state.projectId);state.sessionKey=safeSessionKey(state.sessionKey);localStorage.setItem('shijia_web_project',state.projectId);localStorage.setItem(sessionStorageKey(state.projectId),state.sessionKey)}
function chooseValidSelection(selectedProject){state.projectId=safeProjectId(state.projectId);if(!state.projects.some(x=>safeProjectId(x?.id)===state.projectId)){state.projectId=!projectSelectionInitialized&&selectedProject!==undefined?safeProjectId(selectedProject):safeProjectId(state.projects[0]?.id)}if(!state.projects.some(x=>safeProjectId(x?.id)===state.projectId))state.projectId=safeProjectId(state.projects[0]?.id);projectSelectionInitialized=true;const sessions=currentSessions();const previousIndex=state.sessionIndex;const stored=safeSessionKey(localStorage.getItem(sessionStorageKey(state.projectId)));let session=sessions.find(x=>safeSessionKey(x?.sessionKey)===safeSessionKey(state.sessionKey));if(!session&&previousIndex>=0)session=sessions.find(x=>Number(x?.index)===Number(previousIndex));if(!session)session=sessions.find(x=>safeSessionKey(x?.sessionKey)===stored);if(!session)session=sessions[0]||null;state.sessionKey=state.projectId?safeSessionKey(session?.sessionKey):'';state.sessionIndex=session?Number(session.index):-1;rememberSelection()}
function hasConversationRoute(){return !!safeProjectId(currentProject()?.id)&&!!safeSessionKey(state.sessionKey)}
function loadDetail(){const project=currentProject(),projectId=safeProjectId(project?.id),sessionKey=safeSessionKey(state.sessionKey);if(!projectId||!sessionKey){state.sessionKey='';state.detail=null;state.messageSignature='';renderHeader();renderMessages([]);setStatus('');return Promise.resolve()}state.sessionKey=sessionKey;return api(`/web/api/projects/${encodeURIComponent(projectId)}/sessions/${encodeURIComponent(sessionKey)}`).then(data=>{state.detail=data;state.sessionIndex=Number(data.index);renderHeader();renderMessages(data.messages||[]);setStatus(data.status||'',data.running||data.busy?'busy':'')}).catch(error=>flashError(error.message))}
function setStatus(text,tone=''){const node=$('status');node.textContent=text||'??';node.className='status '+(tone==='busy'?'busy':tone==='error'?'error-tone':'');$('stopConversation').classList.toggle('hidden',!(state.detail?.running));$('sendButton').disabled=!hasConversationRoute()||!!state.detail?.busy}
function sendMessage(){const input=$('messageInput'),message=input.value.trim(),project=currentProject(),projectId=safeProjectId(project?.id),sessionKey=safeSessionKey(state.sessionKey);if(!message||!projectId||!sessionKey)return;try{$('sendButton').disabled=true;setStatus('???','busy');api(`/web/api/projects/${encodeURIComponent(projectId)}/sessions/${encodeURIComponent(sessionKey)}/messages`,{method:'POST',body:JSON.stringify({message})}).then(()=>{input.value='';state.messageSignature='';refreshData(true)}).catch(error=>{flashError(error.message);setStatus('????','error')}).finally(()=>{$('sendButton').disabled=false})}catch(error){flashError(error.message)}}
function stopConversation(){const project=currentProject(),projectId=safeProjectId(project?.id),sessionKey=safeSessionKey(state.sessionKey);if(!projectId||!sessionKey)return;api(`/web/api/projects/${encodeURIComponent(projectId)}/sessions/${encodeURIComponent(sessionKey)}/stop`,{method:'POST',body:'{}'}).then(()=>refreshData(true)).catch(error=>flashError(error.message))}

$('loginForm').onsubmit=async event=>{event.preventDefault();showLoginError('');try{const data=await api('/web/api/auth/login',{method:'POST',body:JSON.stringify({accessCode:$('accessCode').value})});token=data.token;localStorage.setItem('shijia_web_token',token);showApp(true);await refreshData()}catch(error){showLoginError(error.message)}};
$('menuButton').onclick=()=>openDrawer(true);$('closeDrawer').onclick=()=>openDrawer(false);$('drawerBg').onclick=()=>openDrawer(false);$('conversationEntry').onclick=()=>setView('conversation');$('workflowEntry').onclick=()=>setView('workflow');$('workflowRefresh').onclick=()=>refreshData();$('projectSelect').onchange=async()=>{state.projectId=$('projectSelect').value;state.sessionKey=localStorage.getItem(sessionStorageKey(state.projectId))||'';state.sessionIndex=-1;chooseValidSelection();state.messageSignature='';renderSelectors();renderHeader();await loadDetail()};$('sessionSelect').onchange=async()=>{state.sessionKey=$('sessionSelect').value;state.sessionIndex=Number(currentSession()?.index??-1);rememberSelection();state.messageSignature='';renderHeader();await loadDetail()};$('composer').onsubmit=event=>{event.preventDefault();sendMessage()};$('messageInput').onkeydown=event=>{if(event.key==='Enter'&&event.ctrlKey&&!event.isComposing){event.preventDefault();sendMessage()}};$('stopConversation').onclick=stopConversation;$('newSession').onclick=()=>{$('newSessionDescription').value='';$('newSessionModel').value='';$('newSessionModal').classList.remove('hidden');$('newSessionDescription').focus()};$('cancelNewSession').onclick=()=>$('newSessionModal').classList.add('hidden');$('newSessionForm').onsubmit=event=>{event.preventDefault();createSession($('newSessionDescription').value.trim()||'无描述',$('newSessionModel').value.trim())};
document.addEventListener('click',event=>{const run=event.target.closest('[data-run]'),stop=event.target.closest('[data-stop-workflow]'),running=event.target.closest('[data-stop-running]'),jump=event.target.closest('[data-project]');if(run)runWorkflow(run.dataset.run);if(stop)runWorkflow(stop.dataset.stopWorkflow,true);if(running)api(`/web/api/running/${encodeURIComponent(running.dataset.stopRunning)}/stop`,{method:'POST',body:'{}'}).then(()=>refreshData(true)).catch(error=>flashError(error.message));if(jump){state.projectId=jump.dataset.project;state.sessionKey=jump.dataset.session;state.sessionIndex=Number(jump.dataset.index);rememberSelection();state.messageSignature='';chooseValidSelection();renderSelectors();setView('conversation');loadDetail()}});
if(token){showApp(true);refreshData().catch(()=>showApp(false))}else showApp(false);let pollTick=0;setInterval(()=>{if(!token||document.hidden)return;pollTick++;if(state.view==='conversation'&&pollTick%4!==0)loadDetail();else refreshData(true)},2200);
</script>
</body>
</html>
